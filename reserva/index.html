<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="robots" content="noindex,nofollow">
  <title>Reserva direta · SNT Studios</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

       do site, no molde do check-in: sem CDN, sem fonte externa. Duas telas:
       com ?studio&entrada&saida, os dados do hóspede antes do checkout da
       Pagar.me; com ?c=<código>, a volta do pagamento. O preço mostrado aqui
       é só informação -- quem cobra é o servidor, que recalcula. */
    :root { --fundo:#020617; --cartao:#0f172a; --linha:#1e293b; --tinta:#e2e8f0; --suave:#94a3b8; --verde:#10b981; --verde-esc:#059669; --erro:#f87171; --aviso:#fbbf24; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--fundo); color:var(--tinta); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { max-width:640px; margin:0 auto; padding:28px 16px 64px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; }
    .marca { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.01em; color:inherit; text-decoration:none; }
    .marca img { width:30px; height:30px; }
    .idiomas { display:flex; gap:4px; }
    .idiomas button { background:transparent; border:1px solid var(--linha); color:var(--suave); border-radius:8px; padding:4px 9px; font:600 12px system-ui; cursor:pointer; }
    .idiomas button[aria-pressed="true"] { background:var(--verde); border-color:var(--verde); color:#03140e; }
    h1 { font-size:26px; line-height:1.2; margin:0 0 6px; text-wrap:balance; }
    .sub { color:var(--suave); margin:0 0 18px; }
    .reserva { background:var(--cartao); border:1px solid var(--linha); border-radius:14px; padding:14px 16px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px 8px; margin-bottom:18px; }
    .reserva div span { display:block; color:var(--suave); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
    .reserva div b { font-size:15px; }
    .precos { grid-column:1/-1; border-top:1px solid var(--linha); padding-top:10px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 16px; font-variant-numeric:tabular-nums; }
    .precos .pix b { color:var(--verde); font-size:20px; }
    .precos small { color:var(--suave); display:block; }
    .teste { border:1px solid rgba(251,191,36,.45); background:rgba(251,191,36,.1); color:#fde68a; border-radius:10px; padding:8px 12px; font-size:13px; font-weight:700; margin:0 0 14px; }
    fieldset { border:1px solid var(--linha); border-radius:14px; padding:16px; margin:0 0 16px; background:var(--cartao); }
    legend { padding:0 6px; font-weight:700; }
    .grade { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .grade .largo { grid-column:1/-1; }
    label { display:flex; flex-direction:column; gap:5px; font-size:14px; color:var(--suave); }
    label small.dica { font-size:12px; color:var(--suave); }
    input, select { background:#020617; border:1px solid #334155; border-radius:10px; color:var(--tinta); padding:10px 12px; font:inherit; font-size:16px; width:100%; }
    .doc { display:grid; grid-template-columns:130px 1fr; gap:8px; }
    input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--verde); outline-offset:2px; }
    .invalido input, .invalido select { border-color:var(--erro); }
    .msg-erro { color:var(--erro); font-size:13px; }
    .regras { margin:0 0 10px; padding-left:18px; color:var(--suave); font-size:14px; }
    .politica { white-space:pre-line; color:var(--tinta); font-size:14px; background:#020617; border:1px solid var(--linha); border-radius:10px; padding:10px 12px; margin:0 0 12px; }
    h3 { font-size:14px; margin:4px 0 6px; color:var(--tinta); }
    .aceite { flex-direction:row; align-items:flex-start; gap:10px; color:var(--tinta); }
    .aceite input { width:20px; height:20px; margin-top:2px; flex:none; }
    .enviar, .botao { display:block; width:100%; text-align:center; background:var(--verde); color:#03140e; border:0; border-radius:12px; padding:14px; font:800 16px system-ui; cursor:pointer; text-decoration:none; }
    .enviar:disabled { opacity:.6; cursor:wait; }
    .botao.secundario { background:transparent; color:var(--tinta); border:1px solid #334155; margin-top:10px; font-weight:700; }
    .nota { color:var(--suave); font-size:13px; margin-top:12px; }
    .nota a { color:var(--verde); }
    .estado { background:var(--cartao); border:1px solid var(--linha); border-radius:14px; padding:22px 18px; text-align:center; }
    .estado h2 { margin:6px 0 8px; font-size:22px; text-wrap:balance; }
    .estado p { color:var(--suave); margin:0 0 6px; }
    .estado .reserva { text-align:left; margin:16px 0; }
    .estado .acoes { margin-top:16px; }
    .icone { font-size:40px; line-height:1; color:var(--verde); }
    .icone.espera { color:var(--aviso); }
    .icone.ruim { color:var(--erro); }
    .girando { width:34px; height:34px; border:3px solid var(--linha); border-top-color:var(--verde); border-radius:50%; margin:0 auto 8px; animation:gira 1s linear infinite; }
    @keyframes gira { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .girando { animation:none; } }
    [hidden] { display:none !important; }
    @media (max-width:520px) { .grade { grid-template-columns:1fr; } .reserva { grid-template-columns:1fr 1fr; } }
  </style>
</head>

    <a class="marca" href="/"><img src="/assets/favicon.svg" alt=""><span>SNT Studios</span></a>

      <button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button>
    </div>
  </header>

  <section id="carregando" class="estado"><div class="girando" aria-hidden="true"></div><p data-t="carregando"></p></section>

    <div class="icone ruim" aria-hidden="true">!</div><h2 id="problema-tit"></h2><p id="problema-txt"></p>
    <div class="acoes"><a class="botao" id="problema-whats" target="_blank" rel="noopener noreferrer" data-t="falar_whats"></a><a class="botao secundario" href="/#reservar" data-t="nova_cotacao"></a></div>
  </section>
  <section id="situacao" class="estado" hidden aria-live="polite">
    <div id="s-icone" class="icone" aria-hidden="true"></div>
    <h2 id="s-tit"></h2><p id="s-txt"></p>
    <div class="reserva" id="s-resumo"></div>
    <div class="acoes" id="s-acoes"></div>
  </section>

  <form id="form" novalidate hidden>
    <h1 data-t="titulo"></h1>
    <p class="sub" data-t="subtitulo"></p>
    <p class="teste" id="aviso-teste" hidden></p>
    <div class="reserva" id="f-resumo"></div>

    <fieldset>
      <legend data-t="seus_dados"></legend>
      <div class="grade">

        <label data-campo="telefone"><span data-t="whatsapp"></span><input name="telefone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+55 11 98765-4321"><small class="dica" data-t="whatsapp_dica"></small><small class="msg-erro"></small></label>
        <label class="largo" data-campo="documento"><span data-t="documento"></span>
          <span class="doc"><select name="documentoTipo" aria-label="Tipo de documento"><option value="cpf">CPF</option><option value="passaporte" data-t="passaporte"></option></select><input name="documento" autocomplete="off" inputmode="numeric"></span>
          <small class="dica" data-t="documento_dica"></small><small class="msg-erro"></small></label>
      </div>
    </fieldset>

    <fieldset>
      <legend data-t="regras_tit"></legend>
      <ul class="regras" id="regras"></ul>
      <h3 data-t="politica_tit"></h3>
      <p class="politica" id="politica"></p>
      <label class="aceite" data-campo="aceite"><input type="checkbox" name="aceite"><span data-t="aceito"></span></label>
      <small class="msg-erro" id="erro-aceite"></small>
    </fieldset>

    <p class="msg-erro" id="erro-geral" role="alert"></p>
    <button class="enviar" type="submit" data-t="pagar"></button>
    <p class="nota"><span data-t="seguro"></span></p>
    <p class="nota"><span data-t="lgpd"></span> <a href="/privacidade.html" data-t="privacidade"></a></p>
  </form>
</main>

  const linkWhats = () => WHATS + encodeURIComponent(CODIGO ? t("whats_msg").split("{c}").join(CODIGO) : t("whats_msg_sem"));

  function celula(rotulo, valor) {
    const d = document.createElement("div");
    const s = document.createElement("span"); s.textContent = rotulo;
    const b = document.createElement("b"); b.textContent = valor;
    d.append(s, b);
    return d;
  }
  function resumo(alvo, r) {
    alvo.innerHTML = "";
    alvo.append(celula(t("studio"), NOMES[String(r.studio)] || ("Studio " + r.studio)), celula(t("entrada"), dataBr(r.entrada)), celula(t("saida"), dataBr(r.saida)),
      celula(t("noites"), String(r.noites || noitesEntre(r.entrada, r.saida))), celula(t("hospedes"), String(r.hospedes || "—")));
    if (r.reservaId) alvo.append(celula(t("reserva_n"), "#" + r.reservaId));
    const p = document.createElement("div"); p.className = "precos";
    if (r.pago) {
      p.innerHTML = '<span class="pix"><small></small><b></b></span>';
      $("small", p).textContent = t("pago") + (r.pago.metodo === "pix" ? " · Pix" : " · " + r.pago.parcelas + "x");
      $("b", p).textContent = moeda(r.pago.valor);
    } else if (r.pix) {
      p.innerHTML = '<span class="pix"><b></b><small></small></span><span><b class="cartao"></b><small class="cartao-txt"></small></span>';
      $(".pix b", p).textContent = moeda(r.pix); $(".pix small", p).textContent = t("pix");
      if (r.cartao) { $(".cartao", p).textContent = moeda(r.cartao); $(".cartao-txt", p).textContent = t("cartao").split("{n}").join(String(r.parcelas || 1)); }
    }
    if (p.innerHTML) alvo.append(p);
  }

  function mostrar(id) { telaAtual = id; ["carregando", "problema", "situacao", "form"].forEach((x) => { $("#" + x).hidden = x !== id; }); }
  function problema(codigo) {
    problemaAtual = codigo;
    const [tit, txt] = T[idioma]["p_" + codigo] || T[idioma].p_falha;
    $("#problema-tit").textContent = tit; $("#problema-txt").textContent = txt;
    $("#problema-whats").href = linkWhats();
    mostrar("problema");
  }

  function pintarForm() {
    $("#aviso-teste").hidden = !venda.teste;
    if (venda.teste) $("#aviso-teste").textContent = t("modo_teste").split("{v}").join(moeda(venda.valorTeste));
    const r = { ...pedido, noites: cotacao.noites };
    if (venda.teste) { r.pix = venda.valorTeste; r.cartao = venda.valorTeste; r.parcelas = 1; }
    else { r.pix = cotacao.totalDireta; r.cartao = cotacao.totalCartao; r.parcelas = cotacao.parcelasCartao || 3; }
    resumo($("#f-resumo"), r);
    // A política no idioma escolhido; sem tradução, a em português.
    $("#politica").textContent = (venda.politicas && venda.politicas[idioma]) || venda.politica || t("politica_teste");
  }

  function pintarSituacao() {
    const s = situacao;
    const chave = s.status === "confirmada" && s.teste ? "s_confirmada_teste" : "s_" + s.status;
    const [tit, txt] = T[idioma][chave] || T[idioma].s_processando;
    $("#s-tit").textContent = tit;
    $("#s-txt").textContent = txt.split("{h}").join(s.expiraEm ? hora(s.expiraEm) : "");
    const icone = $("#s-icone");
    icone.className = "icone" + (s.status === "aguardando" || s.status === "processando" ? " espera" : s.status === "confirmada" ? "" : " ruim");
    icone.textContent = s.status === "confirmada" ? "✓" : s.status === "aguardando" || s.status === "processando" ? "…" : "!";
    resumo($("#s-resumo"), { ...s, pago: s.pagamento, pix: s.pagamento ? null : s.valores.pix, cartao: s.pagamento ? null : s.valores.cartao, parcelas: s.valores.parcelas });
    const acoes = $("#s-acoes"); acoes.innerHTML = "";
    const botao = (txtB, href, secundario, novaAba) => {
      const a = document.createElement("a"); a.className = "botao" + (secundario ? " secundario" : ""); a.textContent = txtB; a.href = href;
      if (novaAba) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
      acoes.append(a);
    };
    if (s.status === "confirmada" && s.checkin) {
      botao(t("checkin"), s.checkin, false, false);
      const p = document.createElement("p"); p.className = "nota"; p.textContent = t("checkin_dica"); acoes.append(p);
    }
    if (s.status === "aguardando" && s.pagarEm) botao(t("voltar_pagar"), s.pagarEm, false, false);
    if (s.status === "expirada" || s.status === "erro") botao(t("nova_cotacao"), "/#reservar", false, false);
    botao(t("falar_whats"), linkWhats(), true, true);
    mostrar("situacao");
  }

  function aplicarIdioma() {
    document.documentElement.lang = idioma === "pt" ? "pt-BR" : idioma;
    document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === idioma)));
    document.querySelectorAll("[data-t]").forEach((el) => { const v = T[idioma][el.dataset.t]; if (typeof v === "string") el.textContent = v; });
    $("#regras").innerHTML = "";
    t("regras").forEach((r) => { const li = document.createElement("li"); li.textContent = r; $("#regras").appendChild(li); });
    if (telaAtual === "form" && venda && cotacao) pintarForm();
    if (telaAtual === "situacao" && situacao) pintarSituacao();
    if (telaAtual === "problema") problema(problemaAtual);
  }
  document.querySelectorAll("[data-lang]").forEach((b) => b.onclick = () => { idioma = b.dataset.lang; aplicarIdioma(); });

  function marcarErros(erros) {
    document.querySelectorAll("[data-campo]").forEach((l) => { l.classList.remove("invalido"); const m = $(".msg-erro", l); if (m) m.textContent = ""; });
    $("#erro-aceite").textContent = "";
    let primeiro = null;
    Object.keys(erros || {}).forEach((campo) => {
      if (campo === "aceite") { $("#erro-aceite").textContent = t("erros").aceite; primeiro = primeiro || $("[name=aceite]"); return; }
      const l = $('[data-campo="' + campo + '"]');
      if (!l) { $("#erro-geral").textContent = T[idioma].p_cotacao[1]; return; }
      l.classList.add("invalido"); const m = $(".msg-erro", l); if (m) m.textContent = t("erros")[campo] || "";
      primeiro = primeiro || $("input,select", l);
    });
    if (primeiro) primeiro.focus();
  }

  $("[name=documentoTipo]").onchange = (ev) => { $("[name=documento]").inputMode = ev.target.value === "cpf" ? "numeric" : "text"; };

  $("#form").onsubmit = async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    $("#erro-geral").textContent = "";
    const corpo = {
      ...pedido, idioma, chaveTeste,
      nome: f.nome.value, email: f.email.value, telefone: f.telefone.value,
      documentoTipo: f.documentoTipo.value, documento: f.documento.value, aceite: f.aceite.checked
    };
    const botao = $(".enviar"); botao.disabled = true;
    try {
      const r = await fetch(BASE + "/venda", { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(corpo) });
      const j = await r.json().catch(() => ({}));
      if (r.status === 422) { marcarErros(j.erros); return; }
      if (!r.ok || !j.ok || !j.url) { problema(j.erro || "falha"); return; }
      window.location.href = j.url;
      return;
    } catch (e) { problema("falha"); }
    finally { botao.disabled = false; }
  };

  async function consultarSituacao() {
    try {
      const r = await fetch(BASE + "/reserva?c=" + encodeURIComponent(CODIGO), { headers: { Accept: "application/json" } });
      const j = await r.json().catch(() => ({}));
      if (r.status === 404) return problema("nao_encontrada");
      if (!r.ok || !j.ok) { if (!situacao) problema("falha"); }
      else { situacao = j; pintarSituacao(); }
    } catch (e) { if (!situacao) problema("falha"); }
    consultas += 1;
    // Pagou e voltou antes do aviso chegar: confere de novo por alguns minutos.
    if (situacao && (situacao.status === "aguardando" || situacao.status === "processando") && consultas < 60) setTimeout(consultarSituacao, consultas < 15 ? 4000 : 10000);
  }

  (async function iniciar() {
    aplicarIdioma();
    if (CODIGO) return consultarSituacao();
    if (!pedido.studio || !/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(pedido.entrada) || !/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(pedido.saida)) return problema("link");
    try {
      const qv = chaveTeste ? "?k=" + encodeURIComponent(chaveTeste) : "";
      const [rv, rc] = await Promise.all([
        fetch(BASE + "/venda" + qv, { headers: { Accept: "application/json" } }),
        fetch(BASE + "/cotacao?entrada=" + encodeURIComponent(pedido.entrada) + "&saida=" + encodeURIComponent(pedido.saida) + "&studioId=" + encodeURIComponent(pedido.studio), { headers: { Accept: "application/json" } })
      ]);
      venda = await rv.json().catch(() => null);
      const jc = await rc.json().catch(() => null);
      if (!venda || !venda.ok || !venda.disponivel) return problema("venda_desligada");
      if (!rc.ok || !jc || !jc.ok) return problema("cotacao");
      cotacao = (jc.studios || [])[0];
      if (!cotacao || !cotacao.disponivel) return problema("indisponivel");
      mostrar("form");
      pintarForm();
    } catch (e) { problema("falha"); }
  })();
})();
</script>
</body>
</html>
