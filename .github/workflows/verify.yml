name: Verificar site

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run verify:css
      - run: python validate_site.py
      - run: python test_frontend.py
      # O calendário e a cotação num navegador de verdade, desktop e celular
      # (fila do bot, item 160): os testes estáticos passavam com o seletor
      # abrindo fora da tela e fechando depois da primeira data.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:navegador
